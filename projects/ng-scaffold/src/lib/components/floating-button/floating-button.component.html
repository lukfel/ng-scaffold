@if (floatingButtonConfig(); as config) {
  @if (config.enable && (!config.autoHide || !onTop())) {
    <!-- The group carries the placement, so both halves move as one -->
    <div
      class="lf-floating-button-group lf-transitions"
      [ngClass]="config.horizontalPosition"
      [class.split]="!!config.secondaryButton"
      [class.sticky]="config.sticky"
      [class.show-navbar]="isMobile() && navbarEnabled() && !bottomBarEnabled()"
      [class.show-bottom-bar]="bottomBarEnabled() && !(isMobile() && navbarEnabled())"
      [class.show-navbar-and-bottom-bar]="isMobile() && navbarEnabled() && bottomBarEnabled()"
      [class.show-snackbar]="bottomSnackbarOpen()"
      [class.show-drawer]="!isMobile() && drawerEnabled()">
      <button
        mat-fab
        color="accent"
        class="lf-floating-button"
        [ngClass]="config.cssClass"
        [extended]="!!config.label"
        [disabled]="config.disabled"
        (click)="buttonClicked(config.id)"
        [matTooltip]="config.tooltip!">
        <!-- icon -->
        @if (config.matIcon) {
          <mat-icon>
            {{ config.matIcon }}
          </mat-icon>
        } @else if (config.svgIcon) {
          <mat-icon [svgIcon]="config.svgIcon"></mat-icon>
        }
        <!-- label -->
        @if (config.label) {
          <span class="lf-floating-button-label">
            {{ config.label }}
          </span>
        }
      </button>

      <!-- secondary -->
      @if (config.secondaryButton; as secondary) {
        <button
          mat-fab
          color="accent"
          class="lf-floating-button lf-floating-button-secondary"
          [ngClass]="secondary.cssClass"
          [extended]="!!config.label"
          [disabled]="secondary.disabled || config.disabled"
          [matMenuTriggerFor]="secondary.menuButtons?.length ? menu : null"
          (click)="buttonClicked(secondary.id)"
          [attr.aria-label]="secondary.id || secondary.tooltip"
          [matTooltip]="secondary.tooltip!">
          <!-- icon -->
          @if (secondary.matIcon) {
            <mat-icon class="mr-0">
              {{ secondary.matIcon }}
            </mat-icon>
          } @else if (secondary.svgIcon) {
            <mat-icon class="mr-0" [svgIcon]="secondary.svgIcon"></mat-icon>
          }
        </button>

        <!-- menu -->
        <mat-menu #menu="matMenu" xPosition="before">
          @for (menuButton of secondary.menuButtons; track menuButton.id) {
            <button
              mat-menu-item
              [ngClass]="menuButton.cssClass"
              [disabled]="menuButton.disabled"
              [matTooltip]="menuButton.tooltip"
              (click)="buttonClicked(menuButton.id)">
              <!-- icon -->
              @if (menuButton.matIcon) {
                <mat-icon>
                  {{ menuButton.matIcon }}
                </mat-icon>
              } @else if (menuButton.svgIcon) {
                <mat-icon [svgIcon]="menuButton.svgIcon"></mat-icon>
              }
              <!-- label -->
              <span>{{ menuButton.label }}</span>
            </button>
          }
        </mat-menu>
      }
    </div>
  }
}
